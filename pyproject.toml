[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "magicapply"
version = "0.1.0"
description = "Config-driven, terminal-first job application automation."
requires-python = ">=3.11"
authors = [{ name = "Geoffrey Gray", email = "geoffrey.gray042@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "pyyaml>=6",
    "sqlmodel>=0.0.20",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "types-pyyaml",
]

[project.scripts]
magicapply = "magicapply.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/magicapply"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "integration: hits real network/services; skipped unless MAGICAPPLY_LIVE_TESTS=1",
    "linkedin: hits LinkedIn (ToS-sensitive); skipped unless MAGICAPPLY_LINKEDIN_TESTS=1",
    "anthropic: hits real Anthropic API; skipped unless MAGICAPPLY_LIVE_TESTS=1 + ANTHROPIC_API_KEY",
    "slow: takes noticeable time (>1s); not skipped, just marked",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # allow `assert False` in tests
