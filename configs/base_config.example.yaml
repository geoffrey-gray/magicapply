  #   enrich_apply_urls: true
  #   board_detail_fallback: true
  #   max_board_detail_fetches: 8
  #   require_external_apply: false
  #   max_jobs_per_run: 30

  # W.5b — Glassdoor (MAGICAPPLY_GLASSDOOR_ACK=1; optional GLASSDOOR_SESSION).
  # Same SERP → offsite → capped listing-detail flow as Indeed/LinkedIn.
  # - name: "glassdoor-search"
  #   type: "glassdoor"
  #   enabled: true
  #   queries:
  #     - "Staff Data Scientist"
  #   rate_limit_per_minute: 3
  #   remote_only: true
  #   posted_within_days: 7
  #   max_pages: 2
  #   enrich_descriptions: true
  #   enrich_apply_urls: true
  #   board_detail_fallback: true
  #   max_board_detail_fetches: 8
  #   require_external_apply: false
  #   max_jobs_per_run: 30

  # W.5c — LinkedIn (MAGICAPPLY_LINKEDIN_ACK=1 + auth login / cookies).
  # Prefer: uv run magicapply auth login linkedin --root configs
  # Prefer offsite, fall back to LI detail (capped). Do NOT set max_pages to 40.
  # - name: "linkedin-search"
  #   type: "linkedin"
