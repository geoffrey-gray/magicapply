# Copy to base_config.yaml and edit. `.gitignore` keeps base_config.yaml out of git.
version: 1

llm:
  provider: anthropic
  model: claude-sonnet-4-6
  max_tokens: 4096
  temperature: 0.3

scoring:
  # keyword = ATS-style KeywordBank alignment (default, no LLM).
  # llm     = prompt-based score via llm.provider (Phase 2).
  mode: keyword
  threshold: 70
  prefilter:
    locations: ["Remote", "New York", "Boston"]
    seniority: ["senior", "staff"]
    must_have: []
    exclude: ["security clearance required"]

static_answers:
  full_name: "Geoffrey Gray"
  email: "geoffrey.gray042@gmail.com"
  # Phone also on base resume YAML; composition overlays resume.phone if empty.
  phone: "321-279-2047"
  location: "Boston, MA"
  city: "Boston"
  state: "Massachusetts"
  address_line_1: "123 Main St"
  postal_code: "02108"
  country: "United States"
  country_phone_code: "United States of America (+1)"
  phone_device_type: "Mobile"
  how_did_you_hear: "LinkedIn"
  # Pluralsight: two-level cascade via multiselect. Circle: single listbox pick.
  how_did_you_hear_parent: "Social Media"
  previously_employed: false
  workday_sms_opt_in: true
  linkedin_url: "https://linkedin.com/in/example"
  # current_employer: omit — filled from base resume experience at apply time
  work_authorization: "US citizen"
  authorized_to_work_us: true
  needs_sponsorship_us: false
  requires_sponsorship: false

paths:
  resumes_dir: "../resumes"
  data_dir: "../data"

# Composable form drivers (ARCHITECTURE_COMPOSABLE_FORMS.md).
# Resolution order: field driver_hint → label_regex → variant → ats → default.
form_drivers:
  default: hybrid
  ats:
    workday: rules
  variants:
    workday_listbox: rules
    workday_multiselect: rules
    workday_date_spin: rules
  fields:
    - label_regex: "why do you want"
      driver: llm
    - label_regex: "describe your experience"
      driver: llm

sources:
  - name: "starred-companies"
    type: "career_page"
    urls:
      - "https://www.anthropic.com/careers"
    rate_limit_per_minute: 30

  - name: "watched-jobs"
    type: "job_url"
    urls: []

  # Greenhouse boards-api — public JSON, no auth required.
  # - name: "greenhouse-boards"
  #   type: "greenhouse"
  #   enabled: false
  #   boards:
  #     - "reddit"
  #     - "anthropic"
  #   title_keywords:
  #     - "staff data scientist"
  #     - "principal data scientist"
  #   rate_limit_per_minute: 30

  # W.5a — Indeed (MAGICAPPLY_INDEED_ACK=1; often Cloudflare-blocked).
  # Same posture as LinkedIn: SERP first, offsite JD when external apply exists,
  # capped /viewjob detail fallback. Do NOT set max_pages to 40 (ban-bait).
  # - name: "indeed-search"
  #   type: "indeed"
  #   enabled: true
  #   queries:
  #     - "Staff Data Scientist"
  #   location: "Remote"
  #   rate_limit_per_minute: 3
  #   remote_only: true
  #   posted_within_days: 7
