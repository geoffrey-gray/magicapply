# Copy to base_config.yaml and edit. `.gitignore` keeps base_config.yaml out of git.
version: 1

llm:
  provider: anthropic
  model: claude-sonnet-4-6
  max_tokens: 4096
  temperature: 0.3

scoring:
  threshold: 70
  prefilter:
    locations: ["Remote", "New York", "Boston"]
    seniority: ["senior", "staff"]
    must_have: []
    exclude: ["security clearance required"]

static_answers:
  full_name: "Geoffrey Gray"
  email: "geoffrey.gray042@gmail.com"
  location: "Boston, MA"
  city: "Boston"
  state: "Massachusetts"
  address_line_1: "123 Main St"
  postal_code: "02108"
  country_phone_code: "United States of America (+1)"
  phone_device_type: "Mobile"
  how_did_you_hear: "LinkedIn"
  # Pluralsight: two-level cascade via multiselect. Circle: single listbox pick.
  how_did_you_hear_parent: "Social Media"
  previously_employed: false
  workday_sms_opt_in: true
  linkedin_url: "https://linkedin.com/in/example"
  work_authorization: "US citizen"
  authorized_to_work_us: true
  needs_sponsorship_us: false
  requires_sponsorship: false

paths:
  resumes_dir: "../resumes"
  data_dir: "../data"

# Composable form drivers (ARCHITECTURE_COMPOSABLE_FORMS.md).
# Resolution order: field driver_hint → label_regex → variant → ats → default.
form_drivers:
  default: hybrid
  ats:
    workday: rules
  variants:
    workday_listbox: rules
    workday_multiselect: rules
    workday_date_spin: rules
  fields:
    - label_regex: "why do you want"
      driver: llm
    - label_regex: "describe your experience"
      driver: llm

sources:
  - name: "starred-companies"
    type: "career_page"
    urls:
      - "https://www.anthropic.com/careers"
    rate_limit_per_minute: 30

  - name: "watched-jobs"
    type: "job_url"
    urls: []

  # Greenhouse boards-api — public JSON, no auth required.
  # - name: "greenhouse-boards"
  #   type: "greenhouse"
  #   enabled: false
  #   boards:
  #     - "reddit"
  #     - "anthropic"
  #   title_keywords:
  #     - "staff data scientist"
  #     - "principal data scientist"
  #   rate_limit_per_minute: 30

  # W.5a — Indeed (requires MAGICAPPLY_INDEED_ACK=1; often Cloudflare-blocked).
  # enrich_apply_urls: true extracts "Apply on company site" from detail pages.
  # - name: "indeed-search"
  #   type: "indeed"
  #   enabled: true
  #   queries:
  #     - "Staff Data Scientist"
  #   location: "Remote"
  #   rate_limit_per_minute: 5
  #   enrich_apply_urls: true

  # W.5b — Glassdoor (requires MAGICAPPLY_GLASSDOOR_ACK=1; optional GLASSDOOR_SESSION).
  # - name: "glassdoor-search"
  #   type: "glassdoor"
  #   enabled: true
  #   queries:
  #     - "Staff Data Scientist"
  #   rate_limit_per_minute: 5
  #   enrich_apply_urls: true

  # W.5c — LinkedIn last (MAGICAPPLY_LINKEDIN_ACK=1 + LINKEDIN_LI_AT in .env).
  # enrich_apply_urls: true resolves external apply links from listing pages.
  # - name: "linkedin-search"
  #   type: "linkedin"
  #   enabled: false
  #   queries:
  #     - "Staff Data Scientist"
  #   rate_limit_per_minute: 10
  #   enrich_apply_urls: true


# ---- Proxy rotation (Phase A-C: defeats Cloudflare on Indeed / Glassdoor) ----
#
# Missing / `enabled: false` → adapters fall back to direct fetches (which is
# what they did before the pool landed). When enabled, `refresh()` is called
# once at composition and the pool health-checks proxies in parallel against
# `health_check_url`. `providers` is a fallback list (first non-empty wins) —
# operators can prepend a `vps_pool` or `commercial` provider in the future
# without changing any code.
proxies:
  enabled: false
  health_check_url: "https://httpbin.org/ip"
  health_check_timeout_seconds: 5
  health_check_workers: 20
  cooldown_seconds: 900             # burned proxies stay out 15 min
  providers:
    - type: free_list_scraper
      # `sources: []` → use the shipped defaults (TheSpeedX / roosterkid /
      # monosans / proxyscrape). Add or replace with your own raw-text feeds.
      sources: []
    - type: static_list
      # Operator-curated proxies. Format: `host:port`, `scheme://host:port`,
      # or `user:pass@host:port`. Defaults to http:// when no scheme given.
      entries: []
    # Future slots (add without code changes):
    # - type: vps_pool
    # - type: commercial


# ---- Apply throttle (Phase D: caps hourly + daily apply attempts) ----
#
# Fires just before `handler.apply(...)` in `ApplyPipeline.apply_one`. On a
# cap breach, the Application stays TAILORED so the next batch (once the
# window rolls) picks it up naturally — no manual intervention. Real
# submissions and dry-runs both count against the cap because both generate
# ATS traffic. `global_cap` is a safeguard across every ATS in the same
# window.
apply_throttle:
  ats_default:
    hourly: 6
    daily: 25
  ats_overrides:
    # Example override — Workday tenants are more sensitive to burst apply.
    # workday:
    #   hourly: 4
    #   daily: 20
  global_cap:
    hourly: 15
    daily: 60
