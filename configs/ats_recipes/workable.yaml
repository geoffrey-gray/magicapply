# Workable apply shells (often reached via Indeed redirect).
platform: workable
match_hosts:
  - apply.workable.com
  - jobs.workable.com
  - workable.com
form_selectors:
  - form[data-ui='application-form']
  - form#application-form
  - "[data-ui='application-form']"
  - form.styles__form
  - main form
  - form
submit_selectors:
  - button[type='submit']
  - "button:has-text('Submit application')"
  - "button:has-text('Submit')"
  - "button:has-text('Send application')"
resume_selectors:
  - input[type='file'][name*='resume']
  - input[type='file'][name*='cv']
  - input[type='file']
pre_steps:
  - action: wait
    timeout_ms: 1500
  - action: click
    selector: "button:has-text('Apply')"
    timeout_ms: 2000
  - action: click
    selector: "a:has-text('Apply')"
    timeout_ms: 2000
  - action: click
    selector: "[data-ui='apply-button']"
    timeout_ms: 2000
  - action: wait
    timeout_ms: 1500
wizard:
  next_selectors:
    - "button:has-text('Next')"
    - "button:has-text('Continue')"
    - "button[type='submit']:has-text('Next')"
  max_steps: 8
  review_selectors:
    - button[type='submit']
    - "button:has-text('Submit')"
