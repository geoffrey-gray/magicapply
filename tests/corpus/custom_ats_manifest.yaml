# Custom ATS corpus manifest — operator + CI gate (PR7).
#
# Each entry represents one custom (non–big-4) apply URL we care about.
# - `capture_dir`: promoted DOM/form.yaml bundle under tests/fixtures/captured/.
#   Entries with a capture_dir count in the OFFLINE 80% gate.
# - `live_gate: true`: entry participates in the live custom-ATS test when
#   MAGICAPPLY_CUSTOM_ATS_LIVE=1. Independent of the offline gate.
#
# status: pending | pass | fail | skipped
#   pass    — verified (offline via capture_dir OR live dry-run reached Submit
#             with zero required unhandled)
#   fail    — regressed; capture_dir present but the composable pipeline no
#             longer clears required fields
#   pending — known apply URL, not yet dry-run in this corpus
#   skipped — explicitly out of scope (SSO, iframe-only, LinkedIn Easy Apply)
#
# Grow this file with `scripts/build_custom_ats_corpus.py` after `discover`,
# then promote observed_forms bundles with `scripts/promote_w4_captures.py`.

