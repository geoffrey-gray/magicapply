<!doctype html>
<html>
  <body>
    <h1>Senior Data Scientist</h1>
    <form id="application-form" data-ph-at-id="job-apply-form" method="POST">
      <label>First name <input id="first_name" name="first_name" type="text"></label>
      <label>Last name <input id="last_name" name="last_name" type="text"></label>
      <label>Email <input id="email" name="email" type="email"></label>
      <label>Phone <input id="phone" name="phone" type="tel"></label>
      <label>Resume <input type="file" name="resume"></label>
      <label>Why are you interested?
        <textarea name="interest" id="interest"></textarea>
      </label>
      <button type="submit" id="ph-submit-btn">Submit</button>
    </form>
  </body>
</html>
