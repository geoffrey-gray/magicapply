capture:
  ats: phenom
  e2e_smoke: true
  form_selectors:
    - form#application-form
    - form
  schema_id: phenom_e2e_smoke
  allowed_unhandled: []
app_id: fixture-phenom-careers
job_url: https://careers.example-phenom.com/us/en/job/12345
timestamp: "2026-07-07T12:00:00+00:00"
fields:
  - label: First name
    kind: text
    selector: "#first_name"
    resolved_strategy: static
    required: true
  - label: Last name
    kind: text
    selector: "#last_name"
    resolved_strategy: static
    required: true
  - label: Email
    kind: text
    selector: "#email"
    resolved_strategy: static
    required: true
  - label: Phone
    kind: text
    selector: "#phone"
    resolved_strategy: static
  - label: Resume
    kind: file
    selector: "input[name='resume']"
    resolved_strategy: file
    required: true
  - label: Why are you interested?
    kind: textarea
    selector: "#interest"
    resolved_strategy: narrative
    required: true